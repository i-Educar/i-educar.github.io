<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t1 d1">
  <title id="t1">Fluxograma do ecossistema i-Educar</title>
  <desc id="d1">O núcleo i-Educar no centro conecta i-Diário, pré-matrícula, Educacenso, plugins Buriti e SERVLITCYS.</desc>
  <defs>
    <linearGradient id="gInk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d3f46"/>
      <stop offset="100%" stop-color="#062a2f"/>
    </linearGradient>
    <linearGradient id="gMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3db89a"/>
      <stop offset="100%" stop-color="#1f7a66"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#062a2f" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f7a66"/>
    </marker>
  </defs>
  <rect width="960" height="420" rx="24" fill="#f3f7f6"/>
  <rect x="20" y="20" width="920" height="380" rx="20" fill="#ffffff" stroke="#d7e8e4"/>

  <!-- connectors -->
  <g stroke="#1f7a66" stroke-width="2.2" fill="none" marker-end="url(#arrow)" opacity="0.85">
    <path d="M480 155 V118"/>
    <path d="M380 210 H250"/>
    <path d="M580 210 H710"/>
    <path d="M420 265 L300 330"/>
    <path d="M540 265 L660 330"/>
    <path d="M480 265 V318"/>
  </g>

  <!-- center -->
  <g filter="url(#soft)">
    <rect x="370" y="170" width="220" height="95" rx="18" fill="url(#gInk)"/>
    <text x="480" y="208" text-anchor="middle" fill="#7dcfb6" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">NÚCLEO SGE</text>
    <text x="480" y="234" text-anchor="middle" fill="#ffffff" font-family="Syne, Arial, sans-serif" font-size="22" font-weight="700">i-Educar</text>
    <text x="480" y="252" text-anchor="middle" fill="rgba(244,255,251,.8)" font-family="Manrope, Arial, sans-serif" font-size="12">cadastro único · matrícula · escola</text>
  </g>

  <!-- satellites -->
  <g font-family="Manrope, Arial, sans-serif">
    <g filter="url(#soft)">
      <rect x="380" y="48" width="200" height="64" rx="14" fill="url(#gMint)"/>
      <text x="480" y="72" text-anchor="middle" fill="#062a2f" font-size="15" font-weight="800">i-Diário</text>
      <text x="480" y="92" text-anchor="middle" fill="#0d3f46" font-size="11">microssistema · mesma base</text>
    </g>
    <g filter="url(#soft)">
      <rect x="70" y="178" width="180" height="64" rx="14" fill="#ffffff" stroke="#3db89a" stroke-width="2"/>
      <text x="160" y="206" text-anchor="middle" fill="#062a2f" font-size="14" font-weight="800">Pré-matrícula</text>
      <text x="160" y="226" text-anchor="middle" fill="#4d676c" font-size="11">fila · vagas · transparência</text>
    </g>
    <g filter="url(#soft)">
      <rect x="710" y="178" width="180" height="64" rx="14" fill="#ffffff" stroke="#3db89a" stroke-width="2"/>
      <text x="800" y="206" text-anchor="middle" fill="#062a2f" font-size="14" font-weight="800">Educacenso</text>
      <text x="800" y="226" text-anchor="middle" fill="#4d676c" font-size="11">INEP · layout oficial</text>
    </g>
    <g filter="url(#soft)">
      <rect x="170" y="330" width="200" height="58" rx="14" fill="#062a2f"/>
      <text x="270" y="365" text-anchor="middle" fill="#e6c36a" font-size="14" font-weight="800">Plugins Buriti</text>
    </g>
    <g filter="url(#soft)">
      <rect x="380" y="330" width="200" height="58" rx="14" fill="#062a2f"/>
      <text x="480" y="365" text-anchor="middle" fill="#7dcfb6" font-size="14" font-weight="800">gov.br · GIDE · SGP</text>
    </g>
    <g filter="url(#soft)">
      <rect x="590" y="330" width="200" height="58" rx="14" fill="#062a2f"/>
      <text x="690" y="365" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="800">SERVLITCYS</text>
    </g>
  </g>
</svg>
