<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 240" role="img" aria-labelledby="title desc">
  <title id="title">Fluxograma para fechar a decisão</title>
  <desc id="desc">Quatro etapas: conferir provas, fechar o escopo, nomear os donos na SME e pedir contato à cooperação BURI-TI e LibreCode.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03161b"/>
      <stop offset="100%" stop-color="#0a2a31"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#17a58b"/>
    </marker>
  </defs>
  <rect width="1120" height="240" rx="18" fill="url(#bg)"/>
  <text x="40" y="42" fill="#17a58b" font-family="Sora, Source Sans 3, sans-serif" font-size="13" font-weight="700" letter-spacing="2">FECHAR A DECISÃO</text>
  <text x="40" y="68" fill="#f4fffb" font-family="Sora, Source Sans 3, sans-serif" font-size="20" font-weight="700">Do material da reunião ao pedido de implantação</text>

  <!-- boxes -->
  <g font-family="Source Sans 3, sans-serif">
    <rect x="40" y="96" width="220" height="110" rx="14" fill="#0f2c32" stroke="#17a58b" stroke-width="1.5"/>
    <text x="58" y="122" fill="#17a58b" font-size="12" font-weight="700">01</text>
    <text x="58" y="150" fill="#f4fffb" font-size="16" font-weight="700">Conferir provas</text>
    <text x="58" y="174" fill="#a8c0c4" font-size="13">Telas e PDF de Gestão</text>

    <line x1="270" y1="151" x2="300" y2="151" stroke="#17a58b" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="310" y="96" width="220" height="110" rx="14" fill="#0f2c32" stroke="#17a58b" stroke-width="1.5"/>
    <text x="328" y="122" fill="#17a58b" font-size="12" font-weight="700">02</text>
    <text x="328" y="150" fill="#f4fffb" font-size="16" font-weight="700">Fechar o escopo</text>
    <text x="328" y="174" fill="#a8c0c4" font-size="13">Núcleo + módulos do ano</text>

    <line x1="540" y1="151" x2="570" y2="151" stroke="#17a58b" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="580" y="96" width="220" height="110" rx="14" fill="#0f2c32" stroke="#17a58b" stroke-width="1.5"/>
    <text x="598" y="122" fill="#17a58b" font-size="12" font-weight="700">03</text>
    <text x="598" y="150" fill="#f4fffb" font-size="16" font-weight="700">Nomear os donos</text>
    <text x="598" y="174" fill="#a8c0c4" font-size="13">Matrícula, censo, transporte</text>

    <line x1="810" y1="151" x2="840" y2="151" stroke="#17a58b" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="850" y="96" width="230" height="110" rx="14" fill="#17a58b"/>
    <text x="868" y="122" fill="#03161b" font-size="12" font-weight="700">04</text>
    <text x="868" y="150" fill="#03161b" font-size="16" font-weight="700">Pedir contato</text>
    <text x="868" y="174" fill="#0a2a31" font-size="13">BURI-TI · LibreCode</text>
  </g>
</svg>
